<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | My Digital Diary</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eee8ff, #faf7ff, #e7ddff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #302747;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.96);
            padding: 38px;
            border-radius: 24px;
            box-shadow: 0 18px 55px rgba(91, 64, 145, 0.15);
        }

        .logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 18px;
            border-radius: 22px;
            background: #eee7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #827791;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin: 16px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #e0d8ef;
            border-radius: 11px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #8865d5;
            box-shadow: 0 0 0 3px #f0eaff;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: none;
            border-radius: 11px;
            background: #7653bd;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #6240a7;
        }

        .message {
            background: #fff0f0;
            color: #a33333;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin: 12px 0;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #827791;
        }

        a {
            color: #7653bd;
            font-weight: 600;
            text-decoration: none;
        }

        .tagline {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #a196b3;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="logo">📔</div>

        <h1>My Digital Diary</h1>
        <p class="subtitle">Your thoughts, your private space.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login to Your Diary →</button>
        </form>

        <p class="footer">
            New here? <a href="{{ url_for('register') }}">Create an account</a>
        </p>

        <p class="tagline">A little space just for you ✨</p>
    </main>
</body>
</html>
