
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Entry | Digital Diary</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 25px 15px;
            background: #f4f5fb;
            color: #292744;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 650px;
            margin: 25px auto;
            background: white;
            padding: 28px;
            border-radius: 15px;
            box-shadow: 0 4px 20px #25254b12;
        }

        h2 { color: #5146a5; }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8d8e5;
            border-radius: 8px;
            font: inherit;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button, .back {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 17px;
            border: 0;
            border-radius: 8px;
            background: #5146a5;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .back {
            background: #74748a;
            margin-left: 7px;
        }

        .message {
            padding: 12px;
            margin-bottom: 12px;
            background: #fff0ef;
            color: #a22e2e;
            border-radius: 8px;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>✏️ Edit Diary Entry</h2>
    <p>Update your saved information below.</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label for="title">Title</label>
        <input id="title" type="text" name="title"
               value="{{ entry['title'] }}" required>

        <label for="entry_date">Date</label>
        <input id="entry_date" type="date" name="entry_date"
               value="{{ entry['entry_date'] }}" required>

        <label for="destination">Destination (for Travel Diary)</label>
        <input id="destination" type="text" name="destination"
               value="{{ entry['destination'] or '' }}"
               placeholder="Travel destination, if applicable">

        <label for="expenses">Expense Amount (₹), if applicable</label>
        <input id="expenses" type="number" name="expenses"
               min="0" step="0.01"
               value="{{ entry['expenses'] if entry['expenses'] is not none else '' }}"
               placeholder="Enter amount">

        <label for="status">Status</label>
        <select id="status" name="status">
            <option value="Pending"
                {% if entry['status'] == 'Pending' %}selected{% endif %}>
                Pending
            </option>
            <option value="In Progress"
                {% if entry['status'] == 'In Progress' %}selected{% endif %}>
                In Progress
            </option>
            <option value="Completed"
                {% if entry['status'] == 'Completed' %}selected{% endif %}>
                Completed
            </option>
        </select>

        <label for="content">Description / Thoughts</label>
        <textarea id="content" name="content" required>{{ entry['content'] }}</textarea>

        <button type="submit">Save Changes</button>
        <a class="back" href="{{ url_for('dashboard') }}">Cancel</a>
    </form>
</div>
</body>
</html>
