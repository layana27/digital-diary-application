<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Dashboard | Digital Diary Application</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;

        }

        header {
            background: #243b67;
            color: white;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 24px;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #405b91;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .container {
            max-width: 1150px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 28px;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 9px;
        }

        .welcome p {
            color: #68758a;
            line-height: 1.6;
        }

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 13px 16px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #e5f6e9;
            color: #216536;
        }

        .message.error {
            background: #fde8e8;
            color: #a32626;
        }

        .section-title {
            margin-bottom: 18px;
            font-size: 21px;
        }

        .modules {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .module-card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            border: 1px solid #e6eaf2;
            box-shadow: 0 5px 18px rgba(35, 53, 90, 0.06);
            display: flex;
            flex-direction: column;
            min-height: 205px;
        }

        .module-icon {
            font-size: 32px;
            margin-bottom: 14px;
        }

        .module-card h3 {
            font-size: 19px;
            margin-bottom: 9px;
        }

        .module-card p {
            font-size: 14px;
            color: #748096;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .count {
            font-size: 13px;
            color: #53627b;
            margin-top: auto;
            margin-bottom: 15px;
        }

        .open-link {
            display: inline-block;
            text-align: center;
            background: #3459a1;
            color: white;
            text-decoration: none;
            padding: 11px 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .open-link:hover {
            background: #243b67;
        }

        .bottom-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .bottom-links a {
            text-decoration: none;
            color: #3459a1;
            background: white;
            border: 1px solid #dce3ef;
            padding: 12px 17px;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            color: #8791a3;
            font-size: 13px;
            padding: 35px 15px;
        }

        @media (max-width: 800px) {
            .modules {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 520px) {
            header {
                padding: 18px 5%;
            }

            header h1 {
                font-size: 20px;
            }

            .container {
                margin-top: 25px;
                padding: 0 15px;
            }

            .modules {
                grid-template-columns: 1fr;
            }

            .welcome h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
